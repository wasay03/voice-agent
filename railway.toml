# Railway config-as-code. Region (US East, Virginia — next to Neon us-east-1) and secrets are
# set in the Railway dashboard; Railway injects PORT, which the Dockerfile's CMD honours.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
