# Render Blueprint: free Docker web service in Virginia (same AWS region as Neon us-east-1).
# Secrets are `sync: false`: Render asks for their values when the Blueprint is created.
services:
  - type: web
    name: voice-intake
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_USER
        value: admin
      - key: CLINIC_NAME
        value: Riverside Family Clinic
      - key: AGENT_NAME
        value: Ava
      - key: CLINIC_TZ
        value: America/New_York
      - key: TOOL_TIMEOUT_SECONDS
        value: "4"
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
